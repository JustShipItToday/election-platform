name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh polls, nominees and reported results every 15 minutes. Scheduled runs only fire from the default branch.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Wikipedia is rate-limited, so fetched pages are cached between runs. Each run saves what it fetched,
      # even when it hits its time limit, so a cold start finishes over a few runs.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: elecia-cache-${{ github.run_id }}
          restore-keys: elecia-cache-
      - name: Refresh races, nominees, polls and ballot measures (keeps the last committed data if a source is down)
        run: timeout 600 npm run data
        continue-on-error: true
      - name: Refresh ratings, past results and candidate profiles (keeps the last committed file if it times out)
        run: timeout 600 npm run research
        continue-on-error: true
      - name: Refresh official state tallies (North Carolina)
        run: timeout 120 npm run official
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: elecia-cache-${{ github.run_id }}
      - name: Tests (includes data and calls.json guards)
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
